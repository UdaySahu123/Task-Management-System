# =============================================================================
# Backend configuration
#
# Values wrapped in ${...} come from environment variables, which can be kept
# in a local ".env" file (loaded automatically below, and git-ignored) or set
# in the shell / hosting provider dashboard.
#
# NEVER commit real secrets. Copy ".env.example" to ".env" and fill it in.
# =============================================================================

spring:
  application:
    name: task-management-system

  # Load variables from the untracked .env file (harmless if the file is absent).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/task_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:taskapp}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  jwt:
    # Must be a random string of at least 32 characters. No default on purpose.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Health check used by hosting platforms: GET /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.example.taskmanager: INFO
    org.springframework.security: WARN
