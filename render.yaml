# Render Blueprint — deploys the Spring Boot API as a Docker web service.
# Docs: https://render.com/docs/blueprint-spec
#
# After creating the MySQL database (Railway / Aiven / Render), fill in the
# four "sync: false" values in the Render dashboard.

services:
  - type: web
    name: taskflow-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
